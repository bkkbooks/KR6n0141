body:
  text: 表無表章者表及無表表無表之章二釋如次章若有不欲等者此是不與身語俱者身語俱者相難知故問唯意表者有三思不答有如欲修於四無量者先自審慮合與不合何時何處當端寂定自法作之名審慮思既審慮已知可宜為尅擇處其心決定更無改名決定思後至時處獨坐靜思於苦有情想令離苦於無樂者想之與樂諸如是等名動發思作動意故已前加行未正想與不名根本如是亦成三思業道問唯身語者與三俱者其相云何身語必須由意發故答本發誠心身禮語讚雖由意發但名二業其有發心至時專志䇿身諦語并䇿其意諦想形像名為三業之動發也自從加行心便別故章其此意表等者辨無表中此第一師唯善乃發言發無意表者者意字似剩然其文理揀但發於不表他者加以意字明辨發於不自表者方名無表問一切種子皆不表知約何義故別說無表答約倍增者方名無表其不增者雖自不知不名無表何以故由有勝能而不了知立為無表汎所不知何足別立如世賢達令譽不彰人所共意呼為隱士其餘無名何足呼然言菩薩亦成者二乘定無章唯有三支者無貪無嗔無癡為三章餘染無記者染及無記不善有覆並名為染餘處若言不善無記無記之中便攝有覆章業增上者等者亦同七支上品方發中下即非有說處中為下品者約別義說若實下品以此知非此中必定通處中故義燈指故章有義不善等者此第二解二性皆發章十惡等道業者後三意業成波羅夷如何不發殊勝無表章寧但發身語思種等者此下復以二業相例言獨意種二者共引周法師善與不善名之為二今問此言為對於誰前師已說善者發故又有說云不善無記名之為二此說頗非不可此師無記發故今意解此所言二者即是異義不同身語名之為二或遠乘上十重之理寧由何也何但身語重成無表獨意有異不成無表問何故二者乃是異義答彼此不同何非二耶世有此語好相看者便言無二章三罸業中者身語意三治罸有情名三罸業更撿明文章然意無表等者由此唯識不說於此彼論是說無表色故章有義意表等者此第三師一切不發先教後理其理大意不外彰他即非上品故無無表章雖發十善等者恐外問云說十善戒豈無意三以此答之十善之戒依主為名業寬戒狹章此二說中等諸云三師前二師合同說發故今解此言雖有三師於善不善各但二說發不發故燈第二云法苑二說云任意用不斷後說義為決定今者意准定發無表既菩薩戒具防三業勝於二乘盡未來際云何不發殊勝無表前二說者據處中說非約律儀此言已前只同於後處中雖諍其律不律定發無表不可諍也問如是前後有何差別答此辨能發三業之門下辨無表體類多少復有二師師雖無異義門有別諸師皆斷發者為正二性皆然處中亦爾對法唯識約通三乘立為色者故不相違章無表色中者於無表中此為初解無表具三有義之下為第二解無表但二問向下所辨應無意三答標狹釋寬標隨諸教但言其色釋中盡理通十支也或下唯色十支之者隨教略示又前表中已諍意發足顯無表有之與無此遂但標無表色也前後相彰文方具矣問前於表中何無此三答持犯正在無表位故表極時促何為律等章若布施等者善非律儀不善非是不律儀者名為處中非是一體下文但有一體之解如下當知如此既亦名為無表必須期願非只汎爾為布施等名為處中唯識論中與律不律一處說故故彼論言然依思願乃至謂此或依發勝身語善惡思種增長位立此中七義無簡別故樞前燈後說通處中故亦上品期願分限纂有說此為下品者約其事相不期活命未入法律名為下品不約發心名為下品故發心之處須要上品不爾即無倍增之理無倍增者不名無表問若爾如何是此別相答且其律儀但有七眾支條分限不可闕故法律儀軌非不爾故如是分受時少等者並名處中纂第十二有此明文下辨捨眾處中內有攝善法戒由攝善法內有處中由此今言布施等也問優婆塞夷內有分受何非七眾答在彼分出便是處中約類或全或分之故纂疏亦有比丘戒中說出少時名為處中其不律儀翻律儀者須要活命為業者故其餘殺等非以為業而活命者名處中故如此中言歐擊等者亦要期願分限者也問活命之理寧翻律儀答諸律儀者道活命故名為命道如纂亦有少時不具然此非餘暫節會者並名處中歐者擊也名訓雙彰章決擇等者自前再牒無表之下對下後師別成處中前辨體相此下引文其五十三正說處中所除之二具足十支言一切者於有期願上品之者一切是也非汎善惡章五十四說等者文雖說三正為處中言其色用必非意三章說有布施等者體相既見教文又明故處中業亦有無表章有義處中等者此師亦附唯識論文須要上品方成無表此既非勝故無無表章此亦不然等者此下文徵先難後師大意處中為下下立無表此定通上而違彼也問如何律儀而有中品却違唯識依勝思故答唯識之中大分三品勝劣如此今約其內品類無量如是勝中更細論之不遮律儀劣於處中但約支條及以時分具闕分故不約發心以分二故且今支闕何癈當時發心乞受勝具支者其布施等有如此故問中此言思却名為勝如何相狀為其勝也答殷勤三業盡其力用名之為勝不必悲涕面門出血與身毛竪名之為中章法處雖說等者集玄法字改為諸字此下會違先牒後會正同分受於近事中而分之也約類則分談性在內或三或二並不相違章一切處中等者此下後師却難前師既言處中何有上品故無無表章於二說中等者雖有此語前解為正順多教故理亦長故准燈指前意表發中亦是處中如是三業律不律儀曾無異諍唯於處中有兩說也前辨意表發與不發即准意中有無無表此中說其施歐等類正在身語有無無表亦見二表發與不發前來不曾諍其身語此中不曾辨其意中兩處相顯文義已足若皆具述却成繁癈章謂諸根大種造色等者初之四句舉體總釋次之三句復更指陳前為三類後為兩對體性無別五根為一大種為一造色為一造色即是所造四塵此與五根同為所造大種能造如是根合總立一名次下縱奪但要別身以表依此名為依身不是建立問如何身根別得總名答此為本故眾聚於此故此得名餘皆不立章又依止義等者此第二義更有體性名身一義此中略之章而眾多法等者此亦通妨外應問云若依止義名為身者其眼等根豈不亦爾以此答云彼非與多為所依故此與乃至眼等為依彼彼各為自塵識依非一切故不得其名章表謂表示等者身表之業只有一義不同語表表有二義內字之上加以自意讀之即顯章依身之表者身是身根不表內心但取依身屈申等色表示內心故依主釋不同語表語能示心令他知故彼是持業章此能表了等者兩解別者前解表字不對所詮直對內心表了為訓後解表字對於所詮展轉望心詮表為訓故是不同問前解可爾後解云何名此表業此中正要表示內心令他知故答亦須令他知所欲說舉為詮表可示他故或此二義合之方具表於能說說所說故有作是說兩解皆是取其假聲前解非名後解兼名為不同者非也今謂決定取其實聲要令他聞方表自故攝假歸實名等無失孤用不然章語體即表者後解共語亦直得名帶彼名等語便能表攝假歸實以用顯體故持業釋直取名等能詮所詮無表心義名等作用只對所詮除此更無別作用故別說作用只在於聲非名等故於名等故無表心義故義燈云名等詮所待不得名語表章皆隣近釋者與意相應及作動意二義不同並作隣近意表亦即業同身語假作持業釋故更不言問此表於誰答但自表知自心知故問同時王所不互相緣云何能知成此表義答以前表後後知前故剎那似俱實理前後問何異無表他不知故答無表自亦不能知故問如來如何答可思章戒即解脫者屬而釋之非是作釋亦非訓釋章舊言定共戒者共由俱也道即無漏共義同此禪即靜慮華梵為別章古有釋言等者古意善惡隨其所應一流一類名之為律亦隨善惡各有儀軌名之為儀如優婆塞自為一類所有儀軌年三常等其不律儀且沽酒家別為一類如是乃至設望置座春秋改賣亦有儀軌仍言不者不善名不不律儀名之律儀章今解唯彼善戒得名等者言可法軌不通不善彼設成軌不堪可故如染雖懃亦名懈怠章別解脫即律儀者問律儀之名豈非相用今此無表云何持業答本從現立無表從名或先有財方作持業上下頗多下解更有無表之名章性離囂高等者高下悉是不寂靜故離之為靜章律儀是思等者此定無表依現思故作隣近釋之是語詞或有隣近亦置隔法或意兼帶影依主釋問雖是現思立為無表法處色攝云何隣近答以用從體作隣近釋今又解云隣近不唯心心所作俱是兼帶從彼為名非所有財非所能依二名雙現皆隣近釋直取無表亦可作也此之無表不依定立又不以彼定名呼此故為隣近勝而從之故隣近釋章聖所愛之戒者集玄等者所愛是總通諸無漏戒是其別或戒是通所愛是別故依主釋今解所愛通因通果所愛若因所愛即戒聖之所愛戒所愛若果聖之所愛聖所愛之戒並依主釋章不律儀者等者問不相違因不相違即因作持業釋今何不爾答此是不字望所律儀如無明等不作六釋不相違因是所不中相望違作今此若准不相違因亦可不律即儀作也彼若准此亦可說不作六釋章如惡尸羅等者惡烏故切防染義同尸羅之惡名惡尸羅今此舉例諸十惡法不名律儀如此不得名尸羅也非是舉例不作六釋惡字與不義不同故如何不作六合釋也問曾有戒人可置此名曾無戒人惡於何耶答談性惡彼非必有所方能惡也或有惡他具尸羅者故佛誡之令不親近章古人解云等者古解尸羅即戒名善染亦名戒名尸羅也章由此難言等者既即是惡故不防非准此惡法不得名戒章難今解云等者此難尸羅若難戒者亦准此知或戒尸羅名義不同尸羅清凉定非染惡戒若防非其義即同若云防發義義即寬防惡發善防善發惡並得名故若以此義對前難者不善解名我誰唯以防非解戒但以防發解於戒故防發之名同造作故據難今解只難尸羅可有此理然前解勝有戒無戒受戒捨戒只是善故問如邪受於雞狗戒等既不防非云何名戒答約彼執為防非法故名義亦同但妄別也章非律儀等者兩箇非字望律不律皆不作釋若非律儀望非不律儀作相違釋善者非不律不善之者非律儀體不同故作相違釋於此段中影此釋也前來已示布施歐擊見體不同故影略之若非此中影作相違釋如下置亦可之言若云此中兩名相望既但雙非雙非之言無所表故不作釋者此亦不然何以故縱為一體義相違者亦可作故若非是說約是一體又但雙非無所表故雖是兩非不可離之如非空有離便成失故不作釋此解順文章亦可解言等者乘前一體雙得二名既俱雙非不入六釋未盡理故更為此解隨善不善皆得二名以遮詮中立此名故如布施等非是律儀亦非不律歐等准此故持業釋然以理准可相違釋亦不全同非空非有然唯隨文以之為正名處中故不可當曰持業可爾章律儀是種子等者無表色能依所依相從得名此舉所依意顯律儀即防非體不自加行發身語思故持業釋下依主者取前及後諸現行思名為律儀體非無表故依主釋定道不可作此兩釋隨心現行思上立故只同善來持業釋者名為不爾問律儀為體所依現思無表是用能依假色作依主釋云何不可答此即可爾依種子者亦可此釋文中且約體性無別攝用歸體以體從用不依百法別建立說故不相違下出體中即別分別或前舉等但要所等假無表色作持業釋仍言種者言總意別舉總之語顯是律儀種子上立亦得其名作持業釋若依此義定道雖可作其二釋然不依種名為不爾又其依主行相亦別名為不爾此是前後現行之思彼定道者是體用故又或前解等取無表及現行思都名律儀一分持業亦通持業名為持業為別後解唯持業故不言依主舉種即顯並依主也所言皆者並不律等若依此義定道作釋雖亦有二然無總通種子之理名為不爾於持業中只有現行及無表也問定道無表依現思立即自表如何名無表答別脫無表自亦不知定道但約他不知立或增長用自亦不覺除佛知爾可思章表色為體者有作是說准燈亦取形色為體章意業取前等者且隨小教要思身語作如此配理實意業亦為動發如前已解章其處中業者辨表業也此中初解諸不具者唯有漏故章及佛餘善者饒益有情攝善法戒名為處中問下有章文纂意亦許攝善法戒名為處中云何斷此以為不正答因攝善戒可為處中今並佛位故為不正所以者何因攝善法戒有未具足未可法軌有名處中佛位不爾一切善法無不具成正可法軌名律儀故前解為正問佛雖可爾因中無漏云何不許言唯有漏以為正也答因中無漏亦隨所應無不具足於一行中行一切等亦可法軌非處中故不通無漏下文直依有漏攝善不云皆故問迴心二乘見前無漏既不具成一切一切何非處中若爾初解還非為正答彼受之表唯有漏故此約受體不論行業故唯有漏問何故但言佛身無漏可法可軌不言餘也答且言極成例於十地無漏之處必律儀故下第六門地起之中却唯後解須思章許佛等等者不唯佛位無漏發十地位中亦為無漏發於身語二表業故所發假業雖是有漏能發之思通無漏故章其別解脫等者已上解表下解無表處中無表雖分二性亦不別配非律不律故不相違章由願制思等者上並三類總入此文故處中者不可別說非勝期願章唯識云等者下引諸文並成假立此言願者制戒之願非菩提願其菩提願初引一切菩薩行故此中識疏自解此云由願顯成無表之相乃至隨作善惡多少時節限故其菩提願制於何故此中乃至不律處中樞要具說如何說為等願也又此正是色支戒願其等願如何相故諸未達者其類頗多皆於此文證等願極疎謬矣妄為師矣全不思矣應疾改矣尚有固執不慚所陋當大眾前曲配會云制盡未來一切戒藏何非分限何不同者此言無義等心文只有求佛度有情言無此語故又此中願通不善故章謂此或依等者准彼疏解於此文中具有七義彼疏前五後復二義文不具次今隨論文略次敘之一者依義顯假依實二者發義取其正發揀前二思及後剎那并揀中間不發身語之思彼連身語故揀不發三者勝義揀中下思雖熏種子不發無表不倍增故四者身語顯得色名之所因處五者善惡揀其無記不立無表六者思種揀現行思別脫不依現思立故七者增長揀羯磨前犯捨之後彼前後位非無表故此不約佛佛位已滿雖不增長名無表故今詳文理依常揀法思種之言可為二義思揀其餘受想等故如是即成八義揀法疏略一義章雖非形色等者既非實色明是假立非思是何章十七地中者八根本八近分并中間禪名為十七如是皆止欲惡立名戒本止於不善而立恐墮惡趣非止有覆而立戒故問常說靜慮只是四禪云何此說十七地也答名狹體寬本名只云定律儀故名體俱寬言禪律儀名狹准此有說准此靜慮名通非也章此說道俱無漏戒等者周法師云此釋定共不通無漏之所以也顯道共勝不言定共通於無漏或順小乘或示條然理實定共亦通無漏與道共戒一體義分與定俱故與慧俱故立為二戒章對法云等者此對法文自已會訖今借引會然更釋成章十地隨應有之者八根本地未至中間無七近分如前已解言隨應者其不還應等多少不定章已造作者等者為有現行定慧相應何不皆耶或直取彼偏有此語或遍大文章二業三業者周法師云身語為二并意為三何須二三而別說者為約小乘及大乘故集玄解云即表無表名之為二此二業中各有三業故云爾也章實是色是表者二義為實稱實各實非別有體章然是非業等者是一義假章身語等者上辨假業此辨實業一義是實二義是假三箇非字是三義也相從得名名之為假非于無體章其無表色中等者一實一假義准可知章不現行法者所防者也所發或有故不說之其不律儀定有所發無則不成七業道故章一者分義等者周法師云一一別說名之為分多類合說名之為類故二義別今解分者即是位義約位辨之名為支分故并受學皆名為支或如品分篇章之名以將受學品分勒之後解為勝類者體類即七支類名為支類如下自悉章苾蒭律儀者若言苾蒭及具足者非菩薩戒章一受具足支者此初受時名為一支章謂作表白第四羯磨者一白三羯磨通數表白名為第四以舉兩頭不言中間二羯磨也至第四也作表白前乞戒之位是資方便不在此段章及略攝受等者麤者大也即重戒也羯磨之後略為指示四波羅夷麤罪之相令彼攝受已上並約受者為支不取受者問准瑜伽論先略開示四波羅夷持犯之相令生愛樂方得與授今何授已方略說也又彼何無先表白也答彼說菩薩此聲聞故何故不同釋曰菩薩尋師初遇須先說示令樂聲聞先自為優婆塞沙彌之時已體量故不須先說令其愛樂既與授已若不為說持犯何也又聲聞人從眾乞受若不先白便說羯磨眾不齊故聽不專故菩薩不爾只從師受白於誰故章十戒六法等者十戒即是沙彌沙彌尼者六法即是式叉摩那此之三眾自從歸依至於說相皆是此支章二受隨法學處支者受已隨學名受隨法學處支也學即行持章自初受後者解其受字指初支也接下字義是初支後受之隨等章於毗奈耶者此廣律也次別解脫是略戒本於此二中所有隨順解其隨字隨順前受名為隨也苾蒭尸羅解其法字次下二句解其學處於彼之下通示奉行章此意即顯等者此下章釋配屬可知章謂止持等者解於彼下示其所學初支四重此順四重所有止持性遮之戒是此支也如殺人等在初支中殺傍生等在於此支是其性罪其畜養等是其遮罪此是止持性遮二戒不行彼事名為戒故因止引作作中性者侍尊病等作中遮者護說法等所等者內等明多問何名性遮答此是罪名不由遮制本性是罪名為性罪因制成罪非關本性名為遮罪於應止作皆為此二於此二中應止即止應作即作名之為戒性遮之戒依主釋也於遮罪中遮意頗多或防性罪或生善心或無利益或妨道業諸如是等皆在此支並是隨順前受支故更有為護佗信心者不是順前而亦遮制在第三支問於作持中云何不制而便成罪答不敬侍師不看尊病諸如是等豈須制之方成罪也餘利他事彼本自利不制非罪且作此解後更細對一一戒條而料簡之章三隨護他心支者隨亦隨順隨順前支而護他心言由成前故者此解隨義由謂成前而修此支故是隨前言所有軌則具足者此一義也所行具足是第二義章此意即顯等者此下次第釋前二義此釋軌則即是威儀章其沽酒家等者此第二義所行具足所行處所不如法處不應行往義燈第二旃陀羅者嚴熾上屠也羯耻羅者云斷獄家纂第四云西域別立斷獄之人求財活命周法師云羯耻那者有云唱令家不云何者為唱令家此非唱令至下當引章四隨護如所學處支者隨亦隨順隨順守護如前所立所學處支不令為罪言於微細罪中深見怖畏等者此第一義謂字已下連前進起由聦叡故第二義也牒前見怖欲增聦叡此雖二義並微細罪顯揚論云所犯可出名微細罪理應更有於深重罪及隨法罪深見怖畏此中但言微細罪者舉小況大乃至小罪亦見怖也即瑜伽論無有毀犯犯已還淨章第二十卷脫落箇二字在二十二第二十是修慧地故章若諸苾蒭尸羅成就為第一住者乍觀住字似連於下今撿二論皆屬於上瑜伽論云云何名為安住具戒謂於所受所有學處不虧身業不虧語業無缺無穿如是名為安住具戒顯揚論云此中尸羅成就住者謂於所受學處身業無犯語業無犯不破無穿如是名為尸羅成就住章守別解脫律儀為第二義者瑜伽論云云何名為善能守護別脫律儀謂能守護七眾所受別脫律儀即此律儀眾差別故成多律儀今此義中唯依比丘律儀處說善能守護別解脫律儀顯揚論云守別解脫者謂七眾尸羅名別解脫即此尸羅眾差別故建立多種此中義者唯依比丘相說是名守別解脫律儀前二別者第一約總不犯身語第二約別差別戒相章軌則所行者軌則第三所行第四於軌則中復有三種一威儀路成就軌則即四威儀不越世間隨順世間不越毗奈耶隨順毗奈耶於所應行如所應行即於此中如是而行由此行故不為世間之所譏毀不為賢良正志善士諸同法者諸持律者諸學律者之所呵責二於所作事成就軌則若依服事若便利事乃至敷設臥具等事乃至復有餘事不越世間云云同前三於諸善品加行處所成就軌則若於正法受持讀誦若於尊長修和敬業乃至一切所修加行不越世間云云同前第四所行圓滿之中復有五種非所行處一唱令家二婬女家三沽酒家四國王家五旃荼羅羯耻羅家章於微細罪等者微據小也細即隨小犯已少功能出名小見怖畏者勿我因此不堪證得所未證得乃至世間惡名云章受學學處為第六者受即當此四中第一學即當此四中第二瑜伽論云謂於先受別解脫戒白四羯磨受具足時從戒師所得聞少分學處體性當此第一少分即是四波羅夷或總相少此受具足當此第一次下彼學當此第二彼論次云彼從現教軌範師處得聞所餘別解脫經總略宣說過於一百五十學處皆自誓言一切當學云云故此中言三千學處章彼第一第二等者彼之第五唯怖小罪今此第四并怖大罪於大罪中總別本末如次皆為守護無犯犯已還淨問四波羅夷如何還淨答亦許懺悔不墮惡道但求不共不許重攝章故苾蒭等者此有五眾故置等者或但比丘比丘尼二瑜伽文中只言苾蒭無此等字章近事律儀者正理論云彼先歸依佛法僧已親近承事所尊重師便護尸羅故名近事或能習近如理所為壞惡事業或能親近事佛為師章即離殺生者離損他命後二可知文上互影章三違越等者此言違者即是持名下言越者即是過名違於越故名為違越若不爾者此支便是罪之名也故此違越同下不越勿同後云便多違越彼違即越是言犯故章若有妄語等者周法師云由妄語故覆藏己罪不肯懺悔熏修戒也章離沽酒家放逸處者恐飲等者章近住律儀者正理論云謂此律儀近阿羅漢住以隨學彼故有說此近盡壽戒住有說此戒近時而住纂第十三云近住二因者謂日夜持離欲惡二行與盡形持為因根性劣故因近果住故名近住章一受遠離等者唯有殺盜章二受遠離等者前近事戒只遮佗妻故與初合此并遮自故別為一章三違越等者准前解之章即是三種者此即五戒之上增者故此為八章決定齊戒者集玄解云齊是一戒之別名戒是諸戒之通稱總別合目名為齊戒婆沙論云離非時食是齊亦是齊支餘是戒支而非齊餘聖教中名八齊者是齊支故總名為齊齊是淨義又離喧義章如孝子等離諸樂具者此當初義次下二句當第二義又次二句是第三也節食本為非梵行也章五不壞正念支與前近事第三支同其名雖異義相正同若壞正念即違犯故今此立名與前別者今為形前正念住故言不自在轉者便犯戒也或此更寬章出家五眾等者問沙彌六法既亦具四十戒六法如何具也答自近事時已有輕重故此乃至威儀具足悔過自淨悉皆具有言十及六且約受支不言學者章非定道等者定道十善其支必具故無不同之所以也其不律儀及分受者既非入眾隨其所宜故亦不說不同所以故不立支章論其支類等者七支十支須辨多少至下當知章唯有身三語四支者七中四支通其輕重綺語等三唯是輕也於輕之中更有性遮重者唯性名之為體章所餘但為等者上解四重內雖有輕約重別言下解三輕內有性罪約遮而立或此不是解遮之名對重如是不論性遮言非有別類者不同四重立為四支名非別類於諸戒條溷而論之非不亦有不可說云前四所攝集玄解云普遮之言遍其七支七支之餘為護七支不離七支名非別類言四體者且隨小乘四重而言實有七支綺語等三雖非重戒然是業道故別為類不同其餘輕遮戒也周法師問為護四體餘戒皆是何但三支答三防妄語其用勝故舉其勝者例劣不言非無餘也故但七支今解如前不離七也性遮輕重而有影顯又解所餘四重之餘一切皆是相合總言不離七支名非別類性遮之理只如前解又或四字無是七字章然通防彼等者於所防罪三時三世依大乘說並皆防之周法師云加行等三如次三世此言非也三時三世兩門別故三時各通三世故也大乘義分三世之義有部實有章彼由得別者集玄云得別解脫與定道別定散二心引生別故由此理趣別解脫防現定道通三今或解云定道隨心別故通防別脫在前方便未得鈍故唯現有作是說准了義燈第二卷云別解脫戒有法俱得及法後得無法前得色法鈍故唯防現在定道之得俱通三得通防三世然唯根本不防加行及以後起更有別解如顯正集章通防三時者此是大乘若小乘說唯防根本能防隨心無有前後所防亦爾勢相當也更有別解如顯正集章近事近住者近事之中亦有男女是合二眾已上共五此下近住七眾之外章餘為防此者不飲酒等章近事近住等者諸教施設全分之門在於此中約其類也論律不律及以處中分者在於處中所攝優婆塞戒門中說分及法處色唯律不律義意皆爾非此分外更別有分為處中也章少分遠離等者約支有三約時有三自他為二稱讚慶悅共為十種合十業道名為十十章既名律儀等者分即支分時義可知相從得名分三即別章多分一分者彼經有四一分二分多分滿分故云等也章問若唯修學等者此問答持不問答受其分持者亦名分成不云全成章皆成彼二者彼二之類亦名彼二章義准不律儀等者所准全缺雖同律儀若分處中即不同也今此缺支亦是不律義有唯殺生亦不律故於殺生中更分等降乃至一類殺此非彼方處中也其餘不為活命因緣少時暫為皆入處中並如前說章此二解中等者周法師云前解為正世現見故章處中業道多少不定等者此下即是善中今者四句約支三句約時章多分少分等者一分在少上約近事近住下約十善業道有作是說此望在家出家菩薩即須全受故云出家戒不爾也近事近住十善在家名初攝受出家久攝名為不爾故須全受章論據三乘等者會彼所憑便破彼意顯彼不違教文意故言不約多分者略不言少集玄改不以為及字甚悞飜上通三乘語章何故許有少分持者受持相例雜集問答即是分持章其十善律儀等者周法師云近事等二名為初眾近住等二不爾者其難意云能攝十善既許多少所攝近事近住二種何故不許同於十善多少受耶今解初眾唯是近事對於近住名為初也不爾約何名之為初又唯菩薩近事通十其近住戒與十善戒不相似故雖只約攝近事為正亦可成立二皆分受相相類故章前說為善者此處中中所有二解與律儀中所有二解初解即同後解有異彼之後解唯除近住今此二種皆無分受今斷前解准彼亦然章性罪須護故者慳嗔邪見是性罪故此見是約謗三寶見集玄解云翻顯遮罪有不防護世親攝論第八卷云謂諸菩薩一切性罪不現行故與聲聞共謂殺生等相似遮罪有現行故與彼不共於此學處有聲聞犯菩薩不犯如雨安居觀益有情趣行經宿有菩薩犯聲聞不犯觀益有情而故不行是故菩薩心亦有犯非諸聲聞章色性唯七等者集玄解云七支無表即在法處所攝色後三無表既不名色法同分攝行蘊收故章前後說之者此句連下前後相望有其二門頓漸如下其單重者周法師云近事戒後受出家戒四支名重在近事中早已得故今時更得名之為重三支名單曾未得故又但十戒六法名單後受具戒名為重也有作是說十戒六法皆具七支者非也章從僧乞戒者言從僧處是聲聞戒僧是眾故聲聞之戒從僧乞故唯識疏中亦言從僧作白羯磨是聲聞戒諸多不了將彼己為菩薩戒藏須思審也章心上中下者明非唯勝不立表戒得戒須是勝上心故若依正解取其上品中下不得於理何失章故前位等者已上敘解及以破文並是說受具足戒者此歸正文便通七眾及菩薩戒理趣皆同優婆塞戒前位亦有請乞之文按披經云大德我是丈夫具男子身欲受菩薩優婆塞戒唯願大德憐愍故與授此是乞戒得表熏依與前從僧乞戒位齊及三聚戒我今欲於大德所等文義相似故此文理義通七眾沙彌正學未見正文理須思准章故瑜伽論等者下引此文但證二表在於前位非是別證出家戒相此文雖是說菩薩戒已說七眾義理同故問何知此文是菩薩戒答此中明言從師前故其出家戒從僧乞故又按彼論先說苾蒭必從佗已遂問菩薩既許自受何須復說從他受耶彼論答文有其二義前義為顯慚愧緣故此義為顯造作勝義有師之時從師勝故具足身語造作勝故無師之時方可自受唯意表故不為勝作但不得已而自受故此是彼論文大意故引此文但成前位立身語表不論何眾於若字上論有又字是第二義章又以語言等者上身下語并結可知問聲聞請乞一處無失三聚淨戒兩處之請何位得表何須兩處答准此瑜伽及唯識疏義燈之文不拘何乘必依動發勝思之初應審問彼彼之二請誰為動發前若動發即依於前後若動發即依於後若說後位方動發前請之中先禮雙足如是請言云云何故為審決思又彼文云我今欲於大德所云云之說正是語言表宣所欲云何乃言不是動發有作是難但是請詞何為根本此言甚陋纂疏明云若從他受戒或由身發七支如往師所等或由語發七支如發語請師等又明云乞何非乞戒有云欲者是其將欲乞受名為欲乞故未熏依非得表者斯言大疎彼中明云我今欲於此所引文表宣所欲又羯磨文云汝等今者欲於我所三說云云云何將欲名之為欲乞中置欲羯磨牒欲正相符順不應於此不為動發若有難云訪師受戒此纔見師輙便乞戒不先致請勿輕慢乎此言無義訪師得見先申禮訖不陳請乞不陳所欲師為何事故隨請時便伸所欲師知所為度量可否授與不授聽與不聽不可聽者遣而去之若可聽者即令供養淨心行持令其清淨方就殿堂於佛像前敷設法座如法登昇與之而授爾時不可無言便授須是受者再覆前欲云與我授此第二位唯是臨授登座之時再請令授故辭少也如是不可後方動發由此不可後位方熏成所依也幽贊之文直不別言後位請文唯舉前云若諸菩薩先於菩提發弘願已此是標舉發願之文欲勤修學於能開授如法請受此是第二禮足請師正是表宣所欲之文時彼菩薩令求受者生殷淨心此是第三生殷淨心供養只是為生淨心故不別言意合在此專念長養此是後段為正開授此是正授若其後請乞戒熏依正為急用云何不言若云略者乍可略其稍緩之文不可略其最要之者故知即是覆前請意既同前故更不別言由此亦知其具足戒只有一處彼無前來訪師之理先與其師同處住故便設法則集眾請乞故無兩處請師之理若爾後位正是相當云何不取而取初位答約處當後約相當前但要其初以為正發雖其後處正當聲聞乞戒之處然而已乞但是再申故不用之故後位中無欲乞字不假言故只要引發師之語故如此之說諸未從者切希省察又有難云前位熏依其不堪者甚為虗設今謂無過有依無戒得加行故無依有戒可成大失又有說云身發防三語發防四此不然矣此是不知支分由誰識疏明說由期願故又纂明說身發七支語亦爾故彼次又云語為身表身為語表得互相表又如病等不能動身并語難發雖從他受亦有無表不依表生有勝聖師知他心者凡悞中者更有云云恐煩別註章又解等者下敘異師五眾同前近事近住不可亦爾此師意云此說出家五眾可爾近事近住受三歸處隨師同說何不彼位亦得表戒三歸之言同聲說之示相之言唯師說故章從師求受等者此文便是破此師義其義意云前求請位自發殷重可以立表隨師言處心便不定或無記故不可立表此言不定但約三性不言無心隨師語言非無心故此即七眾皆從前位立表戒也有以此文作正義用說在家者表與無表同時得者不違此文是其敘異又次破也集玄解此為問答文上問此答亦為不可問縱為異解彼意何以沙彌正學亦許前位在後亦同說三歸故答彼前已受更不立之但說戒相唯師言故不可立表此中未諍有心無心但論立表有心非表亦不立故章又自受既不請師等者問此上標舉自受之者為定何戒若苾蒭戒時違瑜伽次前之文彼文前云或復有一唯自然受除苾蒭律儀何以故由苾蒭律儀非一切堪受乃至云云便無軌則樞要義燈皆同此說故成相違若近事戒其近事戒如彼經中亦有揀擇同苾蒭故若菩薩戒云何次下復例之云其菩薩戒准此應知若所住戒豈唯爾耶答准於占察善惡業報差別經說通於七眾皆許自受問豈不與前聖教相違答如前聖教說聲聞人入眾之法須要從師其占察經說其菩薩發菩提心受具足戒乃至正學皆許自受故不相違彼經明說發大心已自誓而受不發大心即不許故問其自受者亦對佛等有乞辭不若有乞辭如何相狀又復云何彼五十三次下文云若自受者唯有意表若無語言誰熏所依又菩薩地說自受已復云啟白請證等皆如前說答若有若無二義卜之且一義云其詞亦有云大德處及以僧處云佛菩薩餘詞並同其五十三為不表師名唯意表雖對於佛先已知故非始表故又一義云更別無詞唯作羯磨初便熏依畢已增長亦是前後但無別詞其菩薩地但例已後啟白請證及以供養故置等言非等已前一一皆具諸說表與無表同時約期可爾論念不然表即從初無表在末非一念故其義深遠不可思議非宜妄卜示忻似比自他益之盜其詳之章後若現行等者樞要亦云少多作彼事便成不善業成業道處必是表故章雖生彼家等者瑜伽之文不作縱奪但是直說先成不律儀後成業道今作遣疑恐疑既成不律儀者應已成表以此通之雖得無表未得成表未曾作故先但心故今准於此可以瑜伽五十三文辨不律儀配菩薩戒因緣法業如是四義其發心者名之為因次樂忍等者名之為緣以別於輕無此相故此略不引樂忍之文或即此上總名為因為名利者名之為緣緣者為也彼論次云又於此活命事重復起心欲樂忍可爾時說不律儀者又此活命即當彼業是活業故即活命中成其法則名之為法有軌度故如是具足彼經四義名不律儀之重者也問云何不律先得無表答極麤猛故初便增長未至根本不成業道不得表業問若有必不至根本者招於何果有無罪耶答成別報業若善不善一切皆爾章或發祈願者此者有語次句遣使後句身業或亦有語章是事如是持者無答法言不須有心章答言能持時得者有答法語必須有心故知二戒有無心別問文雖如是其理者何答從眾僧乞所有羯磨但白眾僧令其聽許故其受者不須有心不令聽故但呼大德僧令聽故其受戒者師先己體堪任其戒只是集眾令印忍故若菩薩戒創從師受所有羯磨白受者云善男子或法弟聽竟已即問汝能受持否答云能受即便得戒不言能受即不得戒如何無心又聲聞戒羯磨文中唯敘來由其甲某甲某甲受具足戒不言戒相不牒所持故通無心其三聚戒牒三聚故既是所持聽之自忖能持即答故非無心能知於此章先邀期心今滿足故者此通釋前二種之戒此中不言有心無心章眾僧和合此時具故者此釋前來聲聞戒也此亦不論有心無心但成末後得戒之理章雖由前位起業熏種等者此下兩縱應親問云前熏種時云何未得法事竟後既或無心云何猶增不別縱此一齊奪之此初二句是縱前位乞戒之時雖熏所依似合得戒超次二句先期之下奪之意云彼未滿故未得增長未得無表今羯磨竟期願滿故方始得戒言法事竟時雖無心等者此縱後位自羯磨竟至未捨來運運增長雖或無心或三性心不合增長復用先期之下奪云先期願滿而作羯磨從初念後白羯磨竟得戒之初乃至未捨亦得增長不失期故此通二戒皆言無心但明增長不唯初得直至未捨故菩薩戒亦通無心若論初得及羯磨時與聲聞戒有無心別故不相違有憑此文說菩薩戒通無心得謂羯磨時許無心者不知此文云初念後不但初念何證於彼有將唯識疏文所說無心得戒證三聚戒無心得者此言非也彼疏明云從僧乞得乃至示法云沙彌得義燈亦只舉云沙彌何以證此三聚戒耶彼文定是說聲聞戒論文正是對小乘故破色處故同此前文破小乘處云或無心或復別緣非大乘戒問何知彼論唯小乘戒答彼是對破小乘實色說假色故小乘無由說三聚戒而對破故諸不達者其類頗多章此法事竟時等者羯磨竟已乃至未捨念念倍增不拘何戒皆有異緣及無心故故無現熏如何體增此文不但指初得位故菩薩戒亦在其內准文上下只說倍增無文說有七倍增者集玄斥云舊相傳解七倍增者既文說理不然也七支倍倍非開七倍章以隨心戒等者舉隨心戒例種無表言隨未曾得者念念倍增故是未曾後念之戒非先有故佛者不增後念便舊名為曾得章餘戒名得等者周法師解近合別脫准定道說有說例餘近事戒等亦唯用增章十種得戒者此皆說得出家具戒非說所餘章相即可爾等者周法師云據其示相可如彼說正理即非如文可知此意不許有自然得集玄解云實理者何謂即實身從因至果成自受用解脫道時得勝捨劣上品無漏別解脫戒自然而得名為實理若示相者即化身也集玄又解作問答文從今大乘至八地初是問詞也或說等下是答詞也問意顯佛非自然得答意顯佛是自然得不從佗受名自然得燈意有爾此文恐非今解自然直不作法果自受者非此自然不從他受之自然得佛滅亦有此者無故章或有初地即得等者此下所辨並是顯佛非是新得從前受之轉至佛位不名自然章如不定性等者此為舉例便為一事章此說別受等者通心受者盡形不捨問十地位中何有不受三聚淨戒尚別心受答准此所說解行千差不遮亦有但盡形受別解脫者問與菩提心如何相應答發心即遠行行不定何妨邀期後後別受不失於菩提心理如行施等亦隨力故或隨機教却是不避頻受之勤章或無漏心等者周法師云即無漏心得受別脫命終不捨集玄解云又准義燈定道無表亦得名為別脫表戒定道位中動身發語亦得說有動發思故章或說生大自宮等者周法師意此亦不說為自然得如見諦得非自然故與燈意異別為一解亦無過失集玄之意從前皆推至此並名自然而得一切至此皆轉捨劣新得勝故今解此意已前所說皆從前得不說佛位更有新得此說亦許佛名新得其有漏者亦名捨故捨之別得佛位律儀或名自然或非自然不出前云不名自然是其本意章事業漏故者若有可增不增名捨佛更無增不增非捨章善心念念不萎歇故者雖然不增不歇非捨餘位不增是萎歇故名為捨也章二見諦得等者了義燈問別解脫無表依於動發思種上立如入見道得別解脫戒既不起身語依何思立答入見道前有期願心動發身語後入見道依此種立不爾即無此從前說有名從他今詳燈文與此意別此立比丘何處熏依誰師誰眾此文自說未有僧故應云義燈談後有爾今此章文說佛初度家族三人舅氏二人見諦便得不假熏依問依何建立答宿世萎種今再令增或依見道無漏種子或義燈解依大乘說約後有僧有不得者此依小乘談初非後不論種子問若依此解大乘談此五人如何答但是示相章受時未有僧故者此五人時未有僧故無為受義章然唯初非後等者准此文意但初成佛有見諦得已後有僧必別受故了義燈說亦有請乞是已後也此談無爾章三善來得者集玄解云佛命善來苾蒭之時爾時得戒正理論云由本願力佛威加故今問大乘熏依等相其義云何答准見諦思有作是說既云願力明知曾熏梵云耶舍此云稱也謂此尊者有大名稱章有說因論等者集玄解云佛問汝家在何答三界無家稱可佛心未滿二十佛許僧中羯磨受戒章敬受八法等者大愛道尼一人餘非或及眷屬五百同得已後不得言八法者佛告阿難今為女人制八盡形受不可過法若能行者即是受戒何者八法阿難雖百歲比丘尼見新受戒比丘應起迎來送去禮拜與敷座令坐如此法應尊重恭敬讚歎盡形受不得過一也比丘尼不得罵比丘比丘呵責不應誹謗言破戒見威儀二也比丘尼不應為比丘作舉罪作憶念作自恣不應遮他覔罪說戒自恣不應呵比丘比丘應呵三也式沙摩那學戒已從僧乞受大戒四也比丘尼犯僧殘應在二部僧中半月行摩那埵此云折伏貢高我慢五也比丘尼半月從僧乞教授六也比丘尼不得在無僧處夏安居七也比丘夏安居竟應往比丘僧中求三事自恣見聞疑罪此法應尊重恭敬讚歎盡形受不得過八也此後三句八法皆有章七遣使得者俱舍疏云此尼端正恐路有難不往僧中僧遣使尼傳法往與授戒彼便得戒以尼端正別開此緣此是遣使與彼授者無三師等若自遣使代受之者即具三師隨其所應後三所攝章八持律為第五得者俱舍疏云邊國僧少許五人受要須一人持律羯磨故云第五周法師云此有二解一云五人皆悉清淨持律今言第五者談羯磨人二云五人皆悉清淨言持律者為第五人即知法之人章六十賢部者集玄解云部者類也此六十人並是尊者耶舍少小朋友聞尊者耶舍歸佛出家遂亦出家聞三歸時即得其戒章佛去世無初六種者集玄解云此文略也據理合云無初六種及第十也不爾何故下云有三周法師意并沙彌戒即有四種若具足戒但七八九佛滅已後三歸依處得沙彌戒不得大戒章其沙彌尼等者除尼為一近事中二共有五眾得戒皆同並先邀期支條時分熏依請乞至三歸竟戒便增長此言竟者如前所說第三羯磨竟時得言更無別語只是指彼分位之言今之受者三竟之法所有語言未知何典今檢詳察優婆塞戒經中文理優婆塞戒具有三種一者三歸二者五戒三者六重第一三歸彼經自云受三歸依已是近事更次進問於五戒中欲受何戒汝謂欲受一分少分多分滿分優婆塞戒耶彼經次云若言竟說須彼答竟欲受何分方可與授名為即說如此之理即是授了三歸依後更別問彼支條多少隨彼所欲方與授之受三歸依若已都得何須更問而更與授故應別作一家之說五戒六法沙彌十戒並於牒彼戒條已竟如十善戒得處而得今此是約先期問訖三歸都得亦不相違彼經次後更有六重優婆塞戒即十重戒前之六種更有二十八條輕戒且如彼經若以二文和會令一只恐不順施設之意且作別部施設不同機類異故如是和會亦不相違然須更撿俱舍論文今或更解彼與此文其義無別彼言三歸是優婆塞即是隨前期願多少並皆已得然未彰顯但彼自期欲為說相須當問之然後方說故正同也前解為本章俱論諍者此句連上彼第十四更有一說慈悲護念竟但得三歸不得五戒上是迦濕彌羅國法師所說慈悲護念處已發五戒於自稱戒是鄔波素迦處更有我從今時乃至命終捨殺生等語然後說云願尊憶持慈悲護念前意大同優婆塞經章有說為受八戒等者此師只憑文相不同得戒處別連環猶如羯磨之勢不同近事解脫之相不開全持如阿羅漢又六法戒依四分律說白四得依根本律說白二得亦是不依三歸而得其沙彌戒優婆塞戒皆不異說應撿諸文章其心廣故等者全持條多名之為廣故得戒處不同近事問此師沙彌正學如何答應同八戒後更撿文章有所了別者揀無知者此當審慮次下發起期願之心便是決定集玄解此為審慮思今恐此心非未決定章又於此活命事等者決定思中重復起心印而希樂當樂忍時得無表也有作是說為動發者非也殺生動發豈無身業章不爾等者此問辭也兩字直非兩句徵之而無表故一句出理諸無表者要表方成下二句答不必當支為表方成佗表亦成殺無表故又解此文上之三句可為審成此文審成先得無表大義意云若不已得無表爾者何因已名不律儀耶何以故無有表業及無無表雙無此二無有因由為不律儀故上一無字貫下表遮或可而字無是及字或是無字以下兩句為通妨文外應問云既得無表豈未表業無表必依表業成故答意如前章二云等者此解大意不律儀者從當為名由有彼根便立彼名必當為故章今難若爾等者即以律儀例不律儀律儀前位不得名故章既爾律儀等者後師為解先申飜質律儀亦先有忍樂故何不先說得無表也彼有忍樂未得無表不約善根先名律儀斯有何失故云當斧章後師解云等者既為質已不應斧責却只歸前無所立義問前來妨難終未能免兩家如何得無妨難答前師解云惡戒易成先得無表善戒難辦事竟方成所以不同後師解云惡易而毀當成決定便為方名善難而讚有可不成成時方立故亦有異問有此義齊何師為正答准樞要意前師為正有作是說准纂十三後師為正說前發心尚為輕故少多作時名為重故章處分已後等者此是遣使作殺生等者事竟方得問遣殺羊等殺猪如何令施僧食施餘何若答不稱邀期無根本業以此准知互用結罪之所以也不可不忌章有自然受者集玄解前十種得中自然同此是義錯也彼佛滅後不說有爾此自然受佛滅豈無須思勿悞此約無師名為自然前直約於不作法故此自然者自作法故瑜伽自有自受羯磨章若許自受等者此下並是瑜伽之意此並約於聲聞之人若大乘人發大心已即許自受如占察經至正學戒亦許自受若其菩薩是欲出家便出家故聲聞不爾辨堪不堪故須從師章由六因中者一意樂損害非實心者二依止損害身帶病者三男形損害謂形沒等四白法損害造無間等污尼賊住五繫屬於佗國王父母不聽許等六為護佗故即變化人章唯除闕減等者此上是前六因擇資此下是後擇師之文唯者定義論文中無疏義加之論有又字阿遮梨耶即軌範師鄔波拕耶即是和上有人無解無行亦闕非唯無有承當之者其軌範師正要作法必須有知與眾一類更要清淨唯其和尚二師為諍住清淨戒一句之文屬上屬下兩師用別前師眾淨不假言之後師其師不須清淨章不知不清淨者知字傳悞宜為和字不和師故不假和故但和僧也集玄解云但見聞疑三根清淨不知彼師不清淨者亦即得戒不從乞故集玄解云但從和尚求受不從和尚乞戒者非也求之與乞其義何別又云羯磨為和尚者此亦非也應說此是得戒和尚不語者也亦非親教章羯磨雖不稱和尚名者問准彼羯磨稱和尚名何言不稱和尚名也羯磨文云大德僧聽此某甲此稱三箇受戒人名下准集玄有解此中稱和尚名非也求受具足戒此某甲今從僧乞受具足戒某甲此處方稱和尚之名為和尚某甲自說清淨無諸難事年滿二十三衣鉢具僧今授某甲具是戒某甲為和尚誰諸長老忍僧與是甲授具足戒某甲為和尚者默然誰不忍者說僧已忍與某甲授具足戒竟某甲為和尚僧忍默然故是事如是持准此正是稱和尚名何言不稱由此集玄解此所言不稱羯磨和尚名也今解不爾決定是言不稱得戒和尚之名應為答云於乞戒處不標和尚但云眾僧明正乞受在眾僧也所以和尚不須清淨言和尚處但是指授非是於彼乞受戒故問言羯磨中何言乞戒答羯磨牒前乞戒言故章而已與彼戒者先已體量已許與授名已與戒恐眾不聽集眾與授是故不須標和尚也今世所集受業和尚雖是當此然不用之別立一人而代之也如親教也章諸師等者集玄以此三字屬上遂云字錯合云須標今謂屬下依倚諸師而斷之也章及菩薩戒者三聚十善或意准前出家五眾菩薩受者章令尊重戒等者會彼經文以為一相非盡理言章答由二因緣令慚愧增故者慚愧為二自受無慚論云由有二種遠離惡戒受隨護支所謂慚愧若於佗處及於自處現行罪時深生羞耻如是於離惡戒受隨護支乃能具足故從佗受若有慚正現前必亦有愧非有愧者必定有慚是故慚法最為強勝問慚愧遍善何有此相答如義燈會且依一相自耻必佗耻佗非自愧耻佗故章若等護持福無差別者論云若有如自所受而深護持當知所生福德等無差別次下是前又若起心云云之文章於自佗罪等者此是疏主助意結文對佗佗責名為佗罪癈佗自責名為自罪罪為佗也餘人不論若唯自受不護佗罪故通佗受自佗修護是為勝義章從佗何人等者於從佗中問起兩門易而不答應准解云從師非餘師謂軌範及以和尚必須清淨非不清淨集玄謂下菩薩地等是答此者非也義門別故下說表非表不開師淨故章若自受等者此約無有所表之師名為意表非無語言瑜伽自有羯磨文故四十一云又諸菩薩欲受菩薩淨戒律儀若不會遇具足功德補特伽羅爾時應對如來像前自受菩薩淨戒律儀應如是受偏袒有肩右膝著地或蹲跪坐作如是言仰啟十方一切諸佛如來已入大地諸菩薩眾我今欲於十方世界佛菩薩所誓受一切菩薩學處誓受一切菩薩淨戒謂律儀戒攝善法戒饒益有情戒如是學處如是淨戒過去一切菩薩已具未來一切菩薩當具普於十方過去一切菩薩今具於是學處於是淨戒過去一切菩薩已學未來一切菩薩當學普於十方現在一切菩薩今學第二第三亦如是說說已應起啟白請證等皆如前說又准纂疏於此不遮有心念者更無語言唯意表發故彼文云若自然受者唯有意表業此不以身語為方便唯以意為方便受得身語七支無表雖云身語亦不表知問即有無表不從表生無身語故答有意成表故此上文不遮心念彼次下文如前所解章縱有傍人等者此文通妨或有發語或唯心念必有身業傍有人見何唯意表以此通之不對彼故不為令於傍人知故不名為表章或亦有表者意即對前傍人名表章論說傍邊一人亦無等者此會論文既通有表豈不違論唯意表耶此會大意我不說云定有傍人亦有傍邊無一人者論據於此都無傍人一人亦無云自受者故無表業但有意表亦不相違四字為句其義甚明章如今對眾等者其自懺者雖無其師亦對其眾非定無人故有表業章遠前方便等者此說定道有從佗義遠從資糧有所教故近從鄰見佛為說故言正起者正能發起是前念也問此定道戒既不作法何須強說從佗受義答對法皆言受所引故不爾如何在彼色攝章故唯可說等者問意表何無答當念即無無分別故望後即有後有知故章非同前位等者准此捨戒只是不增此文甚明如何惑者謂與犯別謂此奪體一齊都無名為捨也故應說云已增之用不可令無如期盡者准犯重者一切皆爾問如是犯者與捨何別答但中下等許可再增與捨不同捨者一向不可重增只許重受犯者只是懺訖使增不重受故定道隨心相中不言彼并體捨如身語表章其身語二表等者有說此下辨相之中辨捨表業集玄此下為捨緣也不及前判此文正同識疏義燈但依初念此必約於一期之初其初一念為正發故起已未竟皆是由初故唯一念第二念等非正由故不可取之若了知此正發之理必不肯說三番各初以一發起後皆同故亦有說云至乞字處至欲字處如是種種皆由不達正發之理又有說云身語各初各防發故是乃不見互表之文亦不了知立支因意並如前說應解義燈或俱時等約其身語有俱不俱若俱不俱皆依初念俱者易知其不俱者熏種雖別其立戒者只要一初互防發故如自在前身立防七語亦如是如前引纂恐有說於身語各立身前語後亦依語立故作此言令知後語不依彼立唯依於前身立七支語先准此是一期故不可別初定是初發一思初故不可一思有兩初故又不可說兩動發故既一動發故唯一初須說互表文理既明不可異思又此文中明說初發身語之處名為表戒其無表戒依此種立所有禮足請師之文正發身語不取何為若以彼為審慮決定何固陋哉若為只是請師之文非熏依者纂第十三直指唯語發七支云如發語請師等故如何不許請師處立又況後文亦是請故若云先禮雙足之處已發身業應已立者是義不然彼未是表心本微故但是人事先設禮故表欲之動即用之故纂雖說云身發七支如往師所不可在路熏戒依故故下等字取在所者禮敬等業發戒依也又有只為纔見便乞事大速易而不許者此在自情豈關法軌又況先申人事已畢不陳所乞更待何時若云已乞何要後位蹲跪請者如前已解臨授再覆知無退轉更加謙敬而希授也具如前說章不由於此定發身語者先已發起是不由此即義燈云剎那等起但是剎那剎那相引起也章有無三性等者性不同前故不可取問三性不定其理如是如何得有無此思者答此前指於第二念後已後不遮有無心時或有無字義連三性只是三性不定之語又此舉總意只要於有無善性不定者也次善只是說善戒故其不善者念念發故但說同時或彼亦初言同時者約非兩次亦不云唯又但談初已後亦或無心等故此依後解章佛即不然等者有說審前捨無表語有說審前捨表之語准然字下後解為勝近乘捨表佛不名捨雖不捨表然亦不可更發無表又或合二以為勝義然字之下別通發表依此義故言不爾者雖種不增現雖剎那並不名捨次下審順如是成已恐疑問云既佛有表應發無表故此遮之不假出理已圓滿故不更熏故捨下緣字今疑無用應是集玄見此緣字判其身下皆為捨緣今不如是如前已解章瑜伽論云者亦五十三前四支中其第二支名所學處今此須通一切學處四根本外並在此攝發心棄捨云更不學名為捨戒此等既輕犯而不捨發心棄捨方乃捨戒發心捨此亦捨根本以相類故劣尚然故三邪戒中學處准此彼言更寬淨戒即是根本戒也或此誓捨亦通根本雖不曾犯慮犯而捨下釋略此章一解云等者只形沒者其戒不捨沒一生二方捨戒也故是一緣章雖知聖人等者自作無形便是無知故非聖人肯為此事但見欲損男根之者方便救護不令損害名施男根獲大功德章如凡時得戒後被虫食者阿育王經第八卷說旃陀羅子已得初果身有惡病一切身體為虫所食口氣臰穢問此經是說入見方食如何為證答例臨入見有被食者或更別有章虫食之時等者周法師云說言入見得戒不失若無其戒如何入見然有沙彌入見道者章今言形沒等者此入論文須先一沒其二方生或沒唯一亦名為沒舊一不捨後牒雖此不名為沒此解約數亦名沒一章二云等者實有六緣約類合此為五緣也有只損形有只增一為二緣故問如何形沒或生於二即捨於戒答准下所解煩惱重故世俗呼彼此為命根是人性氣皆由此也俱舍疏云所依變者心隨變故其失改者舊性便變移改舊日受戒情性故捨戒也章瑜伽第一百等者此下前師難後師也章比丘轉為尼等者十誦四十敘佛昔在舍衛國時爾時有比丘失男根成女形諸比丘不知云何是事白佛佛言即以先出家受具足戒歲數遣入比丘尼眾中又有比丘尼失女形得男根准此問二眾戒條既是不等何不別受如何持犯答根本既同更不重受受具足中唯根本故餘但隨學非別受如是二眾後隨遣入學而持之犯亦爾也周法師解由受戒時諸惡皆斷是發僧尼二戒但為佛制持有差別故轉根持隨得彼戒僧有不犯尼戒之者約佛不制此又前師難後意者轉尚不失何況只損故唯二生方乃失矣章欲入見諦等者三句相連先牒後非此即前來虫食形者章漸命終者此難意云不至命終先捨其根戒必先捨何要命終之一緣也俱舍論說四根命終身命意捨故先無形章若爾何故等者此下後師却難前師六緣不授第三緣是男根損害既不許授明知須捨章必無入見諦等者臨入見諦必不失形前所引緣是初果故已入見者捨戒何失非犯失故犯失必無此但由如命終緣故章亦無漸命終而不捨戒者此意漸死捨形之時便已捨戒正符前難次下解之但無形時便名命終將死之死亦是死支故已捨戒次句復遮非要命終非要已終方召命終故無前來先捨難也問二緣齊捨亦不須二答有未命終失形者故其一者但彰命終問如是只以失形之緣已諺命終何須別立答為棄同分不死之者有此緣故若只命終即可廢從形沒內也此由別有捨同分者故須別立棄眾同分與形沒者可作四句互寬狹故章俱舍云等者前雖互斷此下別斷前師為勝將斷先與會釋相違前說入見有失形者即初無漏有俱無形其俱舍說初無漏根定成十三不說十二俱無二形即十二故信等五根眼等五根五受隨一并及命根既云十三故并男女隨一根也以此會之是小乘義大乘加意却除其形小乘意在過去世故現定成就無意相也問雙瞽絕聾其義云何答必無此者更審思之周師不見五受須一意根過去却並意根為十三也集玄解此作前師縱後師文後師會前所憑俱舍十三根文無男女者是小乘義不可依據乃牒縱之後引瑜伽而為奪也彼十三者意身命三除憂四受並信等五初無漏根此言非也且文不順又根亦差無眼等四何有四受章成十九者除三無漏二形之人無三無漏不說無形故但二形而乃捨戒非無形也章亦有無形故者即前所引阿育王經章斷善根得等者周抄牒文得是問字近一行問受時二善捨時誰先此無答文或此得字無是捨字或猶可也連下標舉分別二捨周法師解受別解脫戒而有二心方便心受斷善方便其戒即捨生得心受正斷善時其戒方捨所以然者斷善但斷生得善根無義能斷方便善故必先斷故所以其戒捨有先後問生得心戒如何感果答求三乘果名為方便求三界等皆生得收今恐此言有少未盡有漏方便豈可不得三界之果章命終已方捨者後身之上失先戒也此就一分論中只云棄眾同分章一起不同分心者誓捨者也於苾蒭戒論言捨學樞章名同近事近住論章皆言不同分心樞要亦言捨學處也名字雖別並是誓願捨之者也名別所以為苾芻戒學處多故章然正法滅等者亦瑜伽文已得不捨更無新受所以者何由於爾時穢劫正起無一有情不損意樂能受具戒此即六因之一因也此非五中捨戒之緣問若有具戒如何法滅無傳受人方為滅故答雖有具戒未必解而能傳受故文雖具戒意樂不順不曾作法而捨於戒不斷善根未是捨緣雖不傳受其戒亦在故不相違章三捨眾同分者此中亦有命終之者亦有入彼異眾之者即入外道章瑜伽論又若等者問此是辨受何證不捨答既許受得故定不捨問前苾蒭戒云何不同其正義師形沒不捨而不受故據其不受合亦捨故此中不捨即許受故答受與不捨不受與捨降其一等若許受者必定不捨不許受者未必皆捨如正法滅不許有受而不捨故故苾蒭者損形不受而不捨戒近事損形受而不捨何以故者其受初得雖於不捨其許受者必定不捨不受理即易之於捨其不許受不必捨也又受雖難捨之復難所以如此細思細思章男女煩惱恒俱行故者恐為過也二眾並爾由此雖得近事之戒不堪承事不名近事前苾蒭中以此為理真不許受章若具受已者此牒具受次下分持是所問答章二起不同分心者不滿一日誓捨者也周法師云入外道類今恐此却是第三中章一云起不同分心二者是第二故內有二故問樞要只云捨學處者如何攝二答樞依後解亦不相違故彼次云非斷善法滅以此准知後解為勝章以近事戒等者恐外問云何不別開此下答之三句為理意為偏有日出捨故所以合此理頗同故又無闕故何妨數同章故知二種為不同分者此結成也二合為一不同分心有說二戒不相似故名不同分非也章隱顯影彰者不開為隱近事中有而顯此也合之為影准近事有名之為彰此無互義有說互影是為太迷章如先已起等者恐云時促如何斷善斷善要先起加行故此下示之若約開之故應有四准此所示不及後解如何已起斷善加行而得受戒章上品邪見等者上品邪見已起加行如何得有上品善心而受戒耶章起上品纏等者梵語波羅夷此云佗勝處此是其罪所招之果即無間獄名佗勝處是最劣處為佗所勝舉處皆勝獨立此名若望其罪有財得名有罪字者亦通依主不知何緣諸有所說不達此義但各述於相濫之解如有說云持者為佗犯者為自為佗持勝有翻此說又如有云煩惱為佗為煩惱勝此等豈不濫於輕罪又有說云准瑜伽論四十一卷一切犯戒皆為他勝此言妄也瑜伽無文如此說故律抄中之翻波羅夷為不共住此是錯者義淨三藏翻佗勝處同此章文此言四者是菩薩者即是十重之中後四若聲聞者即是前四不同所以今略言之菩薩防心以之為勝聲聞防身以之為本語四後一特違菩薩欲和人故利一切故今審毀離故是其重聲聞要證靈稱自障故以為重所餘之罪不及此也又有處言八重之者出家菩薩前四後四又有處言六重罪者優婆塞戒十中前六於四本上加不沽酒及說過故故經稱為優婆塞中芬陀利華其十重者通論四眾諸常云爾故略言之不同所以及異相狀後段當述問如何是此三品相狀答四十末云若諸菩薩毀犯四種佗勝處法數數現行都無慚愧深生愛樂見是功德當知說名上品纏犯幽讚略此以為三義數犯四種一也取恒犯義都無慚愧二也取全犯四樂犯為德三也以此准知具三義者名為上品具二義者名為中品具一義者便入下品又准幽讚次下文云非一暫行即名為捨須數須四於一而數四而非數皆非上品一數為上又解於中四而非數一而數者亦名上品彼意遮於一非數故別遮之世數一捨者所便捨全非但捨一須詳何正章此同於上者有義上字便目上品太心急也應云指此同上所說苾蒭戒也下舉所同要猶取也取決擇分說苾蒭戒犯重捨也此舉菩薩同於聲聞意欲會釋聲聞戒違十輪經是聲聞戒故集玄要字屬上而用謂樞為錯一時悞也章上欲梵燒等者此是聲聞故舉上欲例於餘三又言慚愧當前一義亦例餘二章然不得共住治罸者不得共住即是治罰雖然治罸同上犯者而此不捨章十輪據等者此會二文言如水火意符膠添斷為勝仍伸後解集玄問云犯重不捨與捨何別彼自答云犯者微增捨者全無或復雖有防發功能然全不增今謂不爾微增之理出在自情非本建立無表之趣若少增長名無表者何須上品又其全無及全不增由失無意乃為進退諸處皆說用修舊故應說犯捨必定不增用皆修舊但犯之者懺已再增其捨之者不可再增如是差別不可異求問犯有上下廢有等降何義不許有分全耶答若有微增而防於何下品易防尚猶不防不可防於上品者故不同斷善上善難生而易斷故上惡難防不可微用而防之也故用兩同舊而不增問如何不增而言修舊答已增之用不可無故已妨之惡不可患故但不防於已後惡故不增而舊理在此矣章又解經中等者下第二解先會經文以歸密意後方歸論解二乘者不同菩薩章又菩薩戒等者上雖會文未會正解大小同異故置又空又上會經以為化相尚可苾蒭同前解故約經說全為化相故猶此棄上會經別前更於實捨亦異前解故置又字有作是說此下菩薩三品皆捨同於苾蒭故次文云亦非上纏集玄亦字改為上字意超用文上纏犯失非上纏犯即不失也今解此言菩薩同前但苾蒭異亦字不差然須問用亦上非上失與不失是其大意亦者即是同前解也翻顯苾蒭不須同前是要皆捨如是用文察其聖意妙之妙矣章涅槃經云等者下歸詳斷若全捨者非不解也故各通於有捨不捨全捨全非皆不解意彼師便却解此斷意實說為捨不了化相亦名亦解章四緣故捨者初二但是心言有異並是退捨菩提心攝後二雖是本隨不同並佗勝處亦攝據前不增揀本與隨故隨中言品准本亦然此是初解一一同前二緣也所言隨者是同類義如五無間並皆說有同類罪故如污母罪是殺父母之同類罪諸如是等具如瑜伽今此亦爾其四種之同類罪名為隨順問如何相狀答且如邪見謗三寶罪名為根本其毀壞者是此同類又如其慳破壞佗施是此同類如是其餘未能具示後更撿文又解本隨或約人說本作隨助是此二別章根本勝處等者此第二解並解前來二緣亦別無牒此中本隨不同前二緣中說言其品即同此中言品者也即菩薩地且說隨順如是本四三品皆捨重於隨故隨順既輕上品方捨次下翻成若不作此品捨不同如是本隨輕重何別捨之寧異集玄本隨作性遮者此太踈也如何遮罪犯而捨戒今言稍輕亦可爾也雖輕亦是性罪所攝亦不入於四十八輕只是重中分稍輕也其波羅夷無等降乎又四十八往往說云便遮罪非之非矣謬之謬矣全不思矣殊不詳矣如放火等交會婬等有殺生等破三寶等豈遮罪也應強會耶莫廢力也不改問爾問與重何別答十重之上所有四義因緣法業便是與輕不同者也不爾輕中何不言爾輕既不言故無四者入於輕中重具四義招於無間輕者不爾即招餘獄具四義者是不律儀無四義者或是處中故殺生等兩下皆有輕重不同如是且說二十分差別其餘別相難以具述如瑜伽論自讚毀佗輕重皆有纂自解云不為名利名為輕罪是佗勝處問為名利者四義何攝若不攝者應有不盡答是活業攝或是緣中緣者為也此解為勝章又退菩提心等者必先退捨菩提心故此解為正章問菩薩地云等者所受既同捨何不爾下答大意相狀雖同其心何異是故捨緣亦不同也集玄答下棄字改之以為受字今解別牒初之一句即不須改又目所棄亦不須改集玄又依向下章文改慢為漫今解慢字運心寬廣時劫長遠不求疾終名之為慢如世間說大海不論杓子香累劫累生須香了此豈非是心寬慢乎又心急者為大器乎燒著鍋兒欲開謂乎問七眾即是菩薩律儀其相由疑如何一身受七眾耶軌則支條形相眾類皆不同故若約支攝應說苾蒭具七眾故縱亦不能後不重說重受者違瑜伽故若七身受如何一受不重受耶又羯磨文受一切戒一身受一寧一切耶何名類耶別別一切與別七眾云何別耶必不契於羯磨之文一切學處通七眾故答應說菩薩所有發心極寬廣故從今身受盡未來身其身無量隨何類身皆持是戒故如是受一身受七菩薩不愧為女身故知必不唯此一類故非定不受於女身故又知有益須受之故不爾不應盡未來身更不重受須思須審勿悞勿錯問十無盡戒盡未來身應具受七答彼正是此不論何身便具七也不爾心言不相應故非迷心故一身必不能盡未來章若不受菩薩戒等者集玄等說此說菩薩別心受者二時皆捨菩薩隨類教化眾生有別受也或隨聖教導化眾生須隨別受前解為本下章有文章若生分捨等者集玄解云生分二字傳寫者悞按彼論云若有不捨如是律儀當知餘生亦得隨轉非彼捨者或字不錯此句先牒命終之者名生分捨顯此不捨菩薩戒也此是彼論四緣捨前先辨不捨然後是前四緣捨文章即出家戒等者樓閣受者如頓受者期願令盡未來身者轉為不捨或直發心百千生者盡未來者先期盡形不在此限章即說多日等者復更准餘近事近住皆有期願過無設者此示別受許如此也仍令堪文章別者不得者若非菩薩期願發心別入不得過無施設章若起異品者分也三界九地三世別類並名異分章由四緣者初一後二即皆全捨其受戒捨分全不定章二受戒捨者若有不先發願捨者而便受戒雖有懺悔不必誓捨故別為緣章若暫受戒者明不永捨期願滿已捨善戒後不須作惡却成不律順舊意故如是故有得定捨者後引定故言四業者集玄改四以為思字有解身三語一名四或順現等章瑜伽說言等者休戒還具亦名未捨永捨故章不說休戒等者不說休戒相願滿已於此已後便名永捨不律儀也章義准期願等者既說捨時有期分限不遮具者亦有短長准此捨具隨支別說解脫故即有一人得律不律二名之者問期願盡處是何緣捨答是捨之類初緣所攝願亦攝故惡願盡處捨願必生勢相番故或入處中之第二緣章三命終捨者勢期盡故願捨勢故問願在多生命終捨不答活命之理但一生故彼彼不知在多生故知者作惡不強勝故或命終攝至後後中亦死捨故須詳撿之章四得定捨者問得定之時必先具戒何要此緣說不受戒無人身故答修總報思不心恒與戒思相應但要有戒遠依亦得如先受戒期滿却成不律儀者如此修定依先戒故捨後不律故須此緣又戒有分亦可為依說全無戒乃至三歸亦無之者必無人身此分有戒隨其所應者所未捨修定捨故但三歸者雖得善趣不捨不律依如是戒修定之者捨不律儀說不律儀乃至亦有引定之者屠兒廣額示此相也章有說形沒等者應會瑜伽四緣不盡故此不勝章又說不然者惡戒難捨此不然章許此二種等者形沒正義皆不捨戒二形不捨近事戒故全分總言皆云不捨章由六緣捨者初之五緣通善不善第六一種唯捨善者或於彼中影顯受戒斷不善者不爾此緣在何處攝章一由受心斷壞等者此是誓捨第二期盡淨信煩惱目善不善第三業滿雖期未盡事竟亦捨此自業滿四己施佗所施總壞無表便捨章若菩薩戒中等者此中既辨攝善法戒明知此戒處中所施問如是即違前來所說處中無表有漏為正攝善法戒通無漏故答此中不言皆為處中應說除佛及因無漏彼彼可法非缺少故在律儀攝今說其餘少布施等之攝善法非可法軌故入處中由此說於小布施等由此入前六因辨捨彼無漏等不可約此六因捨故章除此即捨者除命終緣故但有五章或復加六者亦有限至命終者故或是於退菩提心有作是說且言攝善餘二亦有今謂律儀更何處有應說善止已在前文六因之內其饒益戒准此思之攝善饒益可有二門或在處中或在律儀問如是三聚亦有相濫答若約三聚不名律儀別建立故若於律儀不律儀中於彼律儀有攝善等施設異故如是三聚律儀等三定各不同兩處律儀寬狹有異若不爾者前說佛位攝善法戒可法軌故在律儀攝如何和會章七十八指攝事分者彼文自敘契經調伏本母於契經中或四或九二十九事於調伏中說其七相於本母中說十一相調伏七者一者宣說受學軌則事故二者宣說隨順佗勝處事故三者宣說隨順毀犯事故四者宣說有犯自性故五者宣說無犯自性故六者宣說出所犯故七者宣說捨律儀故所言事者當攝事分故名為指然無此言或標名指章有義身業等者語假尋伺唯同前解身既不爾故復別解思為業體故通上三此解為正許受戒故上地不造下地業故其借識者但無記故章其無漏等者上辨有漏則有兩師下辨無漏更無別解章如鼻舌識等者恐外問云諸佛恒居第四靜慮上無尋伺何有身語或何有語隨前兩師為問可知下舉例答如常可知章豈彼世尊等者舉果顯因世尊猶前引而有故章定是無漏者定有是也不言唯是故不相違由前唯曾說於八地無漏別脫故作此語顯通十地漸悟地前皆通無漏受別脫戒通依上地不遮有漏不須畢解章盧舍那佛經者即梵網盧舍說故以為名言十八梵天者諸共解云於前三禪各有三天第四禪九除無想外取大自在遂有問云其五淨居如何得戒彼決定性無發心故彼自答云言總意別或不愚法許皆受持或就化相今謂不爾如大般若除五淨居別有十八前三禪上各加一是其總名初禪梵天二禪光天三禪淨天三四十二第四禪六福生福受及廣果天上三各別即是舊三品業者下更有三清淨自在大自在如是成九通為十八受菩薩戒不相違也問雖有此說豈不相違答其天有二大乘小乘各說十八其四禪各三業報之天大小乘同已外若依小乘天者加五淨居及無想天以成十八此中不用若依大乘於前三禪各更加一菩薩之天總名者是於第四禪別加三箇菩薩之天何以故八地九地十地定生如次是前所加三天下地不定只總加一如次說此十八梵天言此受得菩薩戒故亦不相違此出瑜伽論疏所說諸勿疑謗章不得別受別脫之戒者此意不許聖者別受除聖已外有別受者上但說聖故無別受但有通受問前說十地亦有新受須是曾已而再受之其所捨者豈非別受況彼文云命終猶捨出家戒故此說別受答彼通下界此論上界無出家相心非極厭故無別受問通受如何答通受之意非一身故不遮下生當持之故復言除者亦除上界下界即有此意上凡別受在家如何不許聖者別受又解此文初之二句牒凡無別顯但通受又次二句明聖有別受別脫者飜顯凡無除其要也上界之下釋凡之理不同聖人不須極厭便許能受或可聖人通厭三界厭欲亦有凡厭現身無欲等境無極厭心故無別受此解上界凡唯通受不許別受聖道通別此解稍勝地前菩薩在家出家不能等行入地已後許等行故在家亦許受出家戒凡夫菩薩通受之者邀期不唯在一身受即許受之別受之者在此身故無出家相或無欲厭故無別受至於近事亦須近事出家眾故亦厭欲故亦無此理章既許欲天等者欲天凡夫即許別受近事別脫有欲厭故有所事故亦非出家五眾別解通受即得聖者同前問諸聖菩薩如何不受盡未來際如何有捨答如前已解章但非彼性者如半擇迦雖具彼戒不得名為近事男女名非彼性章故有別脫非菩薩戒者容有彼也不同地獄無非菩薩之別脫戒但有菩薩別脫戒故地獄後解即同鬼傍有非菩薩別解脫戒有是菩薩別解脫戒其說地獄除其無間有說亦通佛威力故問此說五趣皆許受戒菩薩戒經何無地獄其變化人是傍生故答在乃至中又解彼約未受戒者即無地獄此中通說往彼與授亦通地獄故不相違章瑜伽等者近事二緣意樂損害一向不受第二形活許受彼戒不名近事亦不遮於畜生等受故以為證等取地獄正證地獄之後解來鬼謗無諍兼正無失或作通文章靜慮律儀等者無色界者相從得名不假異想章或少分等者隨其伏斷品有多少章已上並是等者望欲惡故但遠治之章略不建立者既言略者明知實有言色戒者無表色戒名為色戒揀於意中無表也章此從所防假名為色者通釋自名發起破異既假得名何防異界大種造也章法爾靜慮皆能伏非者釋成破意此言靜慮亦通無色已約相從得名說故次下兩句結破可知集玄等云此破小乘俱舍所說實大種造彼既無身故無無表彼不許有異界造故章若見道者見道惑也下言修道亦修道惑辨此二惑斷治遠分章唯色六等者此第一解未至中間并四根本束惑超人通依此六若次第人唯初未至初根本後皆治遠分章有義唯修道等者此第二解通於九地能斷欲惑所言唯者揀伏惑超通斷見修即唯五地今唯斷修即過九地此亦束惑超人通九次第同前章許超初果等者初果上超名超初果或單讀兩字略標束惑次下舉自初果之上直取第四是超中二此人許依九地斷於欲界惑也章雖知論文等者對法唯說此依未至故須會之彼論約於已上遠分而決定故但說已上為遠分治不約已上容有斷治而說之也實亦不遮上有遠治有改遠字為近字者不得上意此論前師亦合會釋說未至故准此知之樞要之中唯有後解無六地者章明得斷義等者上明依地下明依身由有遠分故通三界斷治唯欲章不律儀等者先身後繫章處中等者前有兩解初唯有漏後通無漏彼雖斷初唯有漏正今此都敘通無漏者故知二師合任用也令勿執也章身語色者等者前來已總辨實表業此中復別辨二假業故文不重又處中內此通無漏可以通攝故偏言之其餘二假非無漏故此惑通佛故通無漏言二界者是舉總也或兼變似欲界而說或因無漏便總辨之章其表等者等無表色上是有漏下舉無漏下言三界又是舉總章除律儀善外等者攝善饒益皆是處中通不通佛可以思之章唯人趣者但通三州不通欲天章或除地獄皆有者前說具戒但是處中此說律儀不通地獄故不相違此於律儀分二解也集玄總說有無二解云梵網經不說地獄故却除之章不律儀心非勝故者無見惑故章顯揚論云等者其律儀色合於定道不言所發章即三界別解脫者集玄解云合定道說或有資糧生彼亦受章設佛身等者並約防於欲界惡故章顯揚簡別定道者定道不發為簡定道亦發者故但約所防由與合說故如此也章殺一國人者下言三國此隨舉一名之為一又是滿義如云滿國章小乘必有表者次下釋之正理論云彼由意憤身語必變或由呪詛必動身語章大乘唯意表業發殺生者牒大乘義次下為問唯問色名及造不問成殺之相下舉成殺以顯造色章若不爾者者若非唯以意成殺者云云彼論分明名意罸故集玄解云罸者罪也今謂治罸治罸有情章今解等者兩句之文總舉成殺亦有作具又次二句亦總想云約此名色既有殺具必有色名章非彼論意等此下方明示其色相先顯論非唯意獨成須是假佗身語而殺今得色名遠從彼也此直從佗身語名色言唯意者約自無失章動身語必有相故者此却番破小乘說仙自動身語如何相狀雖云呪詛不見教典問如說戒前有罪不言成故妄語約何名色答由其默故法師知淨發起法師之身語故亦遠從彼如仙人意發起鬼神身語殺也又解猶如所止惡色不必現有亦從為名今默代語云我清淨便從彼立且解更思章准此二說者有表唯意名為二說章於中有二者此之科列不是大文但是別脫有師資也章又所逼錄者逼迫記錄章雖懷恐怖等者恐擯而行明非實行又不具行恒行隨一故恐擯也章然後意樂者後字論中是其彼字或此義為自詐現下成損害故章若復有人等者下第二人不名損害非詐現故實修行故章由彼如是無力能故者唯是牒前無力能也前有論言雖復出家然無力能供事師長章所受師長等者此下方舉二所受物此舉所受師長等物此物名為供事之業是自供事之所得故業如家業自家物業名之為業此亦無是信施之物故下通為淨信所施章及受純信行等者上受師物下自受施此文之下通結難消由難消故飜折除等故滅善根有解退滅信施善根不及前義章若扇𢮎迦及半擇迦者纂云扇𢮎迦此云無根勢用半擇迦此云樂欲樂佗於己為過故章又半擇迦等者於第二中復有三種對法有五生便半月嫉妬灌洒除去為五彼生除去當此初後此二別者初即一生無男勢用必定樂佗於己為過是扇𢮎迦名半擇迦第三曾有男根勢用後時方無不定樂佗於己為過或唯扇𢮎或得二名其少分中此文有三此三皆有男根勢用非扇𢮎迦必定樂佗於己為過名半擇迦纂云此中無其灌洒却開嫉妬以為二種妬佗於己方自起用妬佗於他方自起用其灌洒者得佗精血方起男用是嫉妬類不為嫉妬集玄問云此中為攝當二形不答為二解一云即前嫉妬中攝二云不攝然是彼類彼自斷云後說為正對法論中說扇𢮎迦半擇迦例二形故今恐此中須要攝之然在半月男女中攝此中且舉有時節者類無時者彼文別例無時節者章外道賊住者周法師云外道詐為比丘名為賊住若受戒時緣不具受雖受無戒處比丘中同布薩者亦名賊住集玄解云詐在比丘欲覓過者名為賊住章若別異住等者周法師云犯根本罪懺悔之者名別異住不懺悔者名不共住集玄解云犯僧殘者名別異住犯波羅夷名不共住有飜波羅夷為不共住今謂二名是其二罪波羅夷者當來果報罪從果名不共住者現在治罰不令與僧共住布薩既是二罪不應飜為不共住也故大乘中無不共住大乘無此治罸罪故無眾聚故通四眾故俗無此罪其不共住如今規繩又此一名更無二相已懺未懺行相同故故律本云如前後亦如是故勿分二又此是說不許受戒犯僧殘者何預於此彼雖犯戒猶在眾故不須受故應說此言別異住者是說不肯事出家眾半年之者或不曾來作勤䇿者雖除鬚髮別異住故是損白法不與受戒其不共住勿與更授章若諸王臣等者准此不得與佗授戒王臣更互有繫屬故互聽如何可思或王之臣若王所嫌者不得受具若佗劫剝者為賊所収若佗所得者無依倚人為佗所收與佗劫別纂云小夫父母為佗收養雖非父母亦是佗得章既睡眠已者已即是覺論云既睡窹已章若守薗者纂云即守寺門人此下正是所護之意恐謗真實皆非人故章得此惡見者憎惡嫌惡章或有為受者但形損害不損意樂即許受之若損意樂即不容受故置或言章不說因緣前已具辨者不為近事此是論文前有論云問何故此二扇𢮎半擇迦二雖受歸依亦能隨受諸近事男所有學處而不得名近事男耶答近事男者名能親近承事苾蒭苾蒭尼眾彼雖能護所受律儀而不應數親近承事苾蒭苾蒭尼眾苾蒭苾蒭尼等亦復不應親近攝受若摩若觸如是種類又亦不應如近事男而相親善是故彼類不得名近事男然其受護所有學處當知福德等無差別章不應為受者有作是說合此授字今觀頭尾並見資法合此受字只應為字平聲呼之為猶作也不作受者章應為受具足戒故者論文是說前三類了通翻應受三類之文論文只云當知應受如前所說所有律儀無其為字及具足字加具足字顯三別相舉一例餘為猶作也不堪為資章尸羅不清淨等者准此得定必須具戒問但不作惡得引定不答准此必戒問如劫壞時自然得定及修無想豈先戒耶答壞劫初起亦有菩薩獨覺令修先戒十惡便是其戒其三歸依或先有故或有佛時須其三歸無佛之世法僧亦得言自然者不須強緣又無佛法名為自然非不修作其修無想准此亦先修十善戒方得初定乃至方起上界邪見修無想定非不防於欲惡見故不說此思俱時修故但定戒思必俱時故如是一切所有善法若不先依一戒思者不成人天何況上界有戒相助隨應成就人天尊貴若總若別問若爾如何得定防惡答可思如前又隨所應戒防何惡不必全盡定防所餘其支同者可思更有淺深防也伏種等故章更不須重受戒也者問支條尼多如何便得答其不同者但所學故既非所受根本有異故不重受受具足支唯根本故其不同者是學處支問沙彌轉女云何重受六法戒耶答要二年故受六法戒異沙彌故苾蒭與尼受法同故章更加一也者集玄解云此依四分其五分律加不非時食若十誦律說六法者四重為四第五不得與男子身相觸謂腕已上第六不得與男捉手等謂脫已下又說一切有部根本律云六法者一者不得獨在道行二者不得獨渡河三者不得觸丈夫身四者不得與男子同室宿五者不得為媒嫁事六者不得覆尼重罪又四分五分律中皆言白四受若根本律說白二受諸律不同隨部異也前章中說三歸竟時得六法戒者從沙彌尼十戒而說以即彼戒更無別故若各別說理實羯磨竟時得也或是一宗若別二宗受法皆同章若從五戒等者受法別故須重受也僧尼互轉受法不別但學處別故不重受此雖重受亦不別熏戒所依也沙彌受具所熏戒依但玄生支言但是遮戒者所增者也准此尼受六法戒者白四白二亦但增緣沙彌受具所增遍性章若堅為言等者不約三聚三聚淨戒一齊受七章若橫而言之等者出家五眾不說處中章若捨之時等者便飜明之下正是文斷善命終決定頓捨誓犯不定章若烏波索迦等者斯迦准此在家二眾并說處中全頓律分漸處中並如前說章又尼五百戒等者此問尼轉為正學者雖總言七意在四支為捨不捨章一云等者下第二解即與前同此第一解即與前異但捨具足戒之三支不捨同者之四支也問何意不同又出理言亦正相違前所出理體同皆捨此所出理體同不捨答此但約誓捨具定戒不捨正學而以為問故作此言既說不捨正學之戒此四同彼如何捨耶前來總相問捨不捨既是同體一齊皆捨前約體同一齊皆捨此約體同亦皆不捨故言正順下第二解雖四體同其相既別亦捨具七其正學四尚在故也准此似說戒所依別前後類說名同亦得然須更思問前來若問捨正學戒不說十戒如何為解答無有所以捨六非十全無別故不同七支別有三故問若只問捨所增如何答除四外問亦不遮爾此約誓捨隨力為故前來但問四支體故即一向答具足六法捨了三支為六法故故可為問可作兩答須思問犯捨如何答必定一齊并五戒等周法師解集玄亦解並云六法具足作法不同所有四支有捨不捨六法沙彌受法無異定一齊捨今謂須思受法同別又若命終犯重必頓有作是問如何受時即須三次及其捨時即有一齊答難易不同如山上下可以思之今解受時亦有一齊如三聚戒此約聲聞力小量狹故定漸次問先受具足後受三聚其相云何答如從六法受具足戒但加意三并攝善等餘唯增緣所有應戒亦盡未來由再願助令用增故問退菩提心捨者云何答退歸二乘存聲聞戒退歸外道一切皆無應皆思審犯重捨者如歸外道章解云等者修習在現或果歸種一切皆爾種子成辦現所作故章以是等者相從得名以遣殘疑假非此名亦無過失隨心家種隨心家熏招隨心家習業之果正相須故此約超起只是種子若汎言招引起名招亦通現行不爾現修要何所用問道戒如何答約資有漏及變易說章一云等者此小乘說仙人亦動唇口等也既無經教不可為憑章且如等者舉諸說重但要意重即此仙人既歸身語何名意重約前只言動唇口等但結難身若前曾引云呪詛等合結難語章但由仙人等者下解大意仙人實是無有身語章若如此等者此下即是覆其後開合結難云何得說名無表色耶但唯無表成相符故意三無表不須身語下答直遠從他名色如前已解問何不直遮如無貪等須說遠從他身語也答此須歸於殺生罪故色支攝故不同意三章於中重輕等者四重餘輕七支如常在二年內先令知此生愛樂方與授之非正學戒已受七支故不相違章問何故等者此問八上所增之者次問八合此開之者言離錢者遠離名離與下共是八上增者八中無此故以為問言生像者眾生像也更有別解疑而略引生即金像即銀章問何故等者其八戒者五戒之上加其三種不得坐臥高廣大床不得故往觀聽歌舞作唱香油塗身不非時食沙彌十者此八之上加前不得捉金銀等開此故往觀聽歌舞作唱為一香油塗身為一離者開也出家招嫌故開令別顯要堅也不總然也章問通受菩薩戒等者准此問意受三聚戒亦受定道約邀期也章菩薩若起異心等者既名為捨應名為闕應名無戒如何名具隨心戒耶不可說言盡未來際是此問意章答以身中有種子故者具彼種子亦名為具此種非是本有種子是新修者下第二解可生名具不名為闕不名失等有作是說菩薩通受攝得定道故有種子及當可成餘不為例此即亦是思種子也談其受時一齊受得應思問意何問捨已問定道在於三聚何攝答名律儀故於律儀中且言七眾理有十善及以定道其近住戒近事兼之日六是持此八戒故五條恒持章功德在故等者此下結答已修不無捨者准此此即便是有修舊用不爾不盡捨者如何無表雖非感果之用由彼勢力種子感果感果種子或同或異其感果種多於無表無表即但動發思故章答有二解者准燈判前初文所辨是其處中更有第三俱不發解此律不律故唯二解善律無由說不發故章答表即是假等者集玄解云遠表實心亦名為表章剎那即感者感是滅字章是彼種類故也者即是前云從現得名問若爾云何偏名隨心答准纂云如別解脫從受已去剎那剎那運運增長逢緣捨已舊種不滅非如小乘斷得名捨但新剎那七支不生名為捨戒定道自然有心之時剎那增長七支倍增若無心已一類者種相續而生無新增義說名為捨非如別脫一受已去有心無心皆得增長故名隨心章問菩薩地云等者前得捨中有此問答大義無別准此慢字前是慢字慢即寬也慢字已解不知從何又為何緣重此問答章若別受者等字別受出家地前通五入見但二并在家二十地有一天女身故於此隨類實爾受捨其殺生等尚實行故問若爾何故不通七眾答可思此異三聚同受之者彼必不捨此有捨者亦有不捨隨邀期故集玄一解自利心受名別受者此言甚非應唯說云別受七眾名為別受三聚之中通受七眾名為通受章亦可說言不從表生者生不從表發色望他並如前已意表能發身語無表即此便是又前引纂又有動身令解等者語示身者並可准知章問然十業道等者業道無表二有別者實種假用二不同也又有有業無無表者假雖不感然由修力又有從實亦說無表能感果者義燈又云無表業道無差別者無表如業應行蘊攝攝處既別明假實異又有別說業為有分熏亦名為假別建立故章大乘既無等者已上立理此下結問云何從佗兩不名色章文無答意已如前既假名色何妨云爾章成佛有與今不無者周法師云此學應差須勘餘本今且義解其成佛有三字連上至成佛有應是從他次下四字牒今不捨連下為難如何更受與猶并也進第二難名之為與先有不捨如何自然章得勝捨劣等者由果初成特說此言若論新生念念皆爾由此前中有破小乘自然之得畢竟但是假說自然又或約捨有漏之者新得無漏可別因位因通無漏不決定故集立問云既說自然寧受所引答却遠從也今或自然亦名為受不假作法而領之故章問如加行心中者加行善心非生得心章答加行善惡依生得者此顯生得在於前也諸生在前捨之在後如肉團心先託後捨後字之下標加行心所受之戒却捨在於邪見加行方便却是斷善加行或後字連上次以生下示相釋成揀擇之時已違前來加行善也翻者違也勝者雖成斷之即易是故纔欲斷善根時其加行戒已捨之也由此邪見有其九品逆次斷於九品善心上上邪見方可斷於下下善心故蚊虱等不殺者少其人類等殺者亦少于時正德五乙未十月二十三日一交加點畢寫本文字紛乱令他書寫亦有錯濫故多難知重得良本應改正矣應理末學沙門高範胎生六十一歲享保八年癸卯三月朔日以極樂院新禪院二本一交加點畢諾樂藥師寺報恩院高範戒五十七年六十九
